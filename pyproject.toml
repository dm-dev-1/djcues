[project]
name = "djcues"
version = "0.1.0"
description = "Automated rekordbox cue placement based on phrase analysis"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Matt Croydon" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pyrekordbox>=0.4.4",
    "click>=8.0",
]

[project.optional-dependencies]
agentic = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "keyring>=25.0",
]
# Local audio-ML analysis (beat-grid verification, drop enhancement).
# Split into two tiers deliberately: `audio` alone (no torch) covers
# real-audio decoding plus the fast, CPU-friendly analysis paths;
# `ml` is the heavier superset needed for real model inference
# (beat_this for beat tracking, demucs for source separation). Neither
# is required for djcues's core install or for --agentic.
#
# beat_this/demucs replace an original BeatNet/madmom plan: madmom
# (last released 2018) is confirmed broken on modern Python/numpy --
# `from collections import MutableSequence` (removed in Python 3.10)
# and `np.float` (removed in numpy 1.24) both appear in code it imports
# unconditionally, with no maintained fork available. beat_this
# (github.com/CPJKU/beat_this, MIT, ISMIR 2024) is a from-scratch
# replacement from the same research group specifically built without
# that dependency, and was verified end-to-end (real CPU inference,
# correct output) against this project's actual dependency versions.
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    # Fallback decoder for containers soundfile can't open (confirmed
    # this session: AAC-in-MP4/M4A -- soundfile raises "Format not
    # recognised" for both real .m4a/.mp4 files in this project's own
    # library, but av decodes the .m4a one correctly end-to-end).
    # Bundles its own FFmpeg-derived decoders -- no system ffmpeg
    # install needed, confirmed via a real, isolated ~4.6MB install.
    # Tested against av==18.1.0; floor set conservatively lower since
    # only that version was actually verified.
    "av>=13.0",
]
ml = [
    "djcues[audio]",
    "beat-this>=1.1",
    "demucs>=4.1",
]
# Optional: DirectML backend detection for AMD/Intel iGPU on Windows.
# Standalone, not folded into `ml` -- torch-directml hard-pins an exact
# torch version (confirmed live: 0.2.5.dev240914 requires torch==2.4.1,
# which would downgrade whatever demucs/beat-this's own unpinned torch
# resolution installed), and can only be installed under Python
# 3.8-3.12 (confirmed live against PyPI, 2026-09-11: no build exists for
# 3.13+; djcues's own `requires-python = ">=3.10"` above is otherwise
# unaffected -- only this specific extra needs an older interpreter).
#
# IMPORTANT, confirmed live in a separate Python 3.12 verification venv
# (2026-09-12): installing this and selecting --device directml will
# NEVER actually accelerate djcues's analysis. The device itself is
# real and works for ordinary tensor math (verified on real Intel Iris
# Xe Graphics hardware), but both of djcues's ML models -- htdemucs
# (drop_enhance.py) and beat_this's LogMelSpect frontend
# (beat_verify.py) -- depend on STFT/complex-tensor operations that
# DirectML has no support for, and crash with a native, unrecoverable
# process abort ("Invalid or unsupported data type ComplexFloat") the
# instant they're routed through it -- not a catchable Python exception,
# so no retry-on-cpu fallback can save it. djcues.device._probe_directml
# knows this and always reports ok=False for this reason, permanently
# keeping resolve_device() from ever selecting it for real work. This
# extra exists purely so `djcues auth device`/the dashboard can show an
# accurate "torch_directml installed, hardware detected, but
# incompatible with djcues's models" message instead of a generic
# "not installed" one -- it is not a path to real AMD/Intel
# acceleration today.
directml = ["torch-directml"]

[project.urls]
Homepage = "https://github.com/mcroydon/djcues"
Repository = "https://github.com/mcroydon/djcues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "keyring>=25.0",
    "pytest-cov>=7.0",
    "mypy>=2.0",
]

[project.scripts]
djcues = "djcues.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djcues"]

[tool.pytest.ini_options]
testpaths = ["tests"]
